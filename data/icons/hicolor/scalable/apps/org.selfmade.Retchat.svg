  <path d="M 64.00,13.00 L 82.03,10.29 L 81.06,16.36 L 81.22,16.43 L 98.91,20.82 L 95.69,26.06 L 95.82,26.18 L 110.48,37.01 L 105.51,40.62 L 105.57,40.78 L 114.97,56.40 L 109.00,57.82 L 109.00,58.00 L 111.71,76.03 L 105.64,75.06 L 105.57,75.22 L 101.18,92.91 L 95.94,89.69 L 95.82,89.82 L 84.99,104.48 L 81.38,99.51 L 81.22,99.57 L 65.60,108.97 L 64.18,103.00 L 64.00,103.00 L 45.97,105.71 L 46.94,99.64 L 41.50,96.97 L 22.00,111.00 L 25.03,80.50 L 22.43,75.22 L 13.03,59.60 L 19.00,58.18 L 19.00,58.00 L 16.29,39.97 L 22.36,40.94 L 22.43,40.78 L 26.82,23.09 L 32.06,26.31 L 32.18,26.18 L 43.01,11.52 L 46.62,16.49 L 46.78,16.43 L 62.40,7.03 L 63.82,13.00 Z" fill="url(#face)" stroke="url(#face)" stroke-width="2" stroke-linejoin="round"/>
